# Namespaces with their security posture. Every namespace enforces the "restricted" Pod Security
# Standard. "urumi.io/mcp-upstreams" marks namespaces whose MCP servers the gateway may reach
# (its egress NetworkPolicy selects on this label).
apiVersion: v1
kind: Namespace
metadata:
  name: platform
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
---
apiVersion: v1
kind: Namespace
metadata:
  name: store-default
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    urumi.io/mcp-upstreams: "true"
    urumi.io/store: default
---
# Team-internal MCP servers (the test servers live here; admins may register *.mcp-servers.svc URLs).
apiVersion: v1
kind: Namespace
metadata:
  name: mcp-servers
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    urumi.io/mcp-upstreams: "true"

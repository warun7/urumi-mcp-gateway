# k3d cluster for local development.
# Single server node = same topology as a single-node k3s VPS (local/prod parity).
# k3s ships Traefik (ingress), local-path (storage) and an embedded NetworkPolicy controller.
apiVersion: k3d.io/v1alpha5
kind: Simple
metadata:
  name: urumi
servers: 1
agents: 0
ports:
  - port: 80:80
    nodeFilters: [loadbalancer]
  - port: 443:443
    nodeFilters: [loadbalancer]
options:
  k3d:
    wait: true
    timeout: "180s"
  k3s:
    extraArgs:
      # Encrypt Secrets at rest in the k3s datastore (same flag we use on the VPS).
      - arg: --secrets-encryption
        nodeFilters: [server:*]
  kubeconfig:
    updateDefaultKubeconfig: true
    switchCurrentContext: true

# A version tag (v0.2.0) builds the multi-arch production images and pushes them to GHCR as 0.2.0.
# Deploy with: make prod-up DOMAIN=... REGISTRY=ghcr.io/<owner> TAG=0.2.0
name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
  packages: write

jobs:
  images:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        run: make push REGISTRY="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" TAG="${GITHUB_REF_NAME#v}"

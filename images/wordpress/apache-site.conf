<VirtualHost *:8080>
    DocumentRoot /srv/wordpress
    <Directory /srv/wordpress>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
    # Never serve wp-config or dotfiles
    <FilesMatch "^(wp-config.*\.php|\.ht.*)$">
        Require all denied
    </FilesMatch>
    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>

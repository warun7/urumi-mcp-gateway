apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  labels: {{- include "platform.labels" . | nindent 4 }}
data:
  # Runs once, on first initialisation of an empty data directory.
  01-app-role.sh: |
    #!/bin/sh
    set -eu
    psql -v ON_ERROR_STOP=1 -v app_password="$APP_PASSWORD" --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" <<'SQL'
    CREATE ROLE urumi_app LOGIN PASSWORD :'app_password';
    GRANT CONNECT ON DATABASE urumi TO urumi_app;
    GRANT USAGE ON SCHEMA public TO urumi_app;
    SQL
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels: {{- include "platform.labels" . | nindent 4 }}
    app.kubernetes.io/name: postgres
spec:
  selector:
    {{- include "platform.selector" . | nindent 4 }}
    app.kubernetes.io/name: postgres
  ports:
    - { name: postgres, port: 5432, targetPort: postgres }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  labels: {{- include "platform.labels" . | nindent 4 }}
    app.kubernetes.io/name: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      {{- include "platform.selector" . | nindent 6 }}
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        {{- include "platform.labels" . | nindent 8 }}
        app.kubernetes.io/name: postgres
    spec:
      automountServiceAccountToken: false
      # UID 70 = "postgres" in the Alpine image; no root needed when PGDATA is a fresh subdirectory.
      securityContext: {{- include "platform.podSecurity" (dict "uid" 70 "fsGroup" 70) | nindent 8 }}
      terminationGracePeriodSeconds: 60
      containers:
        - name: postgres
          image: {{ include "platform.image" .Values.images.postgres }}
          imagePullPolicy: {{ .Values.images.postgres.pullPolicy }}
          securityContext: {{- include "platform.containerSecurity" . | nindent 12 }}
          args: ["-c", "shared_buffers=64MB", "-c", "max_connections=100", "-c", "log_min_duration_statement=500"]
          ports:
            - { name: postgres, containerPort: 5432 }
          env:
            - { name: POSTGRES_DB, value: urumi }
            - { name: POSTGRES_USER, value: urumi }
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: postgres, key: owner-password } }
            - name: APP_PASSWORD
              valueFrom: { secretKeyRef: { name: postgres, key: app-password } }
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "urumi", "-d", "urumi", "-h", "127.0.0.1"] }
            periodSeconds: 5
          livenessProbe:
            exec: { command: ["pg_isready", "-U", "urumi", "-d", "urumi", "-h", "127.0.0.1"] }
            initialDelaySeconds: 30
            periodSeconds: 20
          resources: {{- toYaml .Values.postgres.resources | nindent 12 }}
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
            - { name: init, mountPath: /docker-entrypoint-initdb.d, readOnly: true }
            - { name: run, mountPath: /var/run/postgresql }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: init
          configMap: { name: postgres-init, defaultMode: 0555 }
        - { name: run, emptyDir: {} }
        - { name: tmp, emptyDir: {} }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        {{- with .Values.postgres.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.postgres.size }}

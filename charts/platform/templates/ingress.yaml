{{- if .Values.ingress.enabled }}
# One origin for everything: the dashboard's cookie session, CSRF Origin check and the OAuth issuer
# all rely on /api, /mcp, /oauth and the UI sharing scheme://host.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: platform
  labels: {{- include "platform.labels" . | nindent 4 }}
  annotations:
    {{- if and .Values.ingress.tls.enabled .Values.ingress.tls.clusterIssuer }}
    cert-manager.io/cluster-issuer: {{ .Values.ingress.tls.clusterIssuer }}
    {{- end }}
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts: [{{ .Values.publicHost | quote }}]
      secretName: {{ .Values.ingress.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ .Values.publicHost | quote }}
      http:
        paths:
          {{- range $p := list "/mcp" "/api" "/oauth" "/.well-known" }}
          - path: {{ $p }}
            pathType: Prefix
            backend:
              service: { name: gateway, port: { name: http } }
          {{- end }}
          - path: /
            pathType: Prefix
            backend:
              service: { name: dashboard, port: { name: http } }
{{- end }}

{{- if not .Values.secrets.existingSecrets }}
# Generated on first install and kept across upgrades (lookup) and uninstalls (resource-policy: keep):
# losing the KEK makes stored upstream credentials undecryptable; losing the pepper invalidates every key.
# Production (secrets.existingSecrets=true) creates both Secrets beforehand: deploy/vps/create-secrets.sh.
apiVersion: v1
kind: Secret
metadata:
  name: gateway
  labels: {{- include "platform.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  kek-keys: {{ include "platform.kek" . }}
  token-pepper: {{ include "platform.secretValue" (dict "ctx" . "secret" "gateway" "key" "token-pepper" "length" 48) }}
  internal-token: {{ include "platform.secretValue" (dict "ctx" . "secret" "gateway" "key" "internal-token" "length" 48) }}
  admin-password: {{ include "platform.secretValue" (dict "ctx" . "secret" "gateway" "key" "admin-password" "length" 20 "value" .Values.admin.password) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres
  labels: {{- include "platform.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  # Schema owner: used only by the migration initContainer.
  owner-password: {{ include "platform.secretValue" (dict "ctx" . "secret" "postgres" "key" "owner-password" "length" 32) }}
  # urumi_app: what the running gateway uses (DML only; no UPDATE/DELETE on audit_events).
  app-password: {{ include "platform.secretValue" (dict "ctx" . "secret" "postgres" "key" "app-password" "length" 32) }}
{{- end }}
{{- /* Production (existingSecrets) gets this copy from deploy/vps/create-secrets.sh instead, so the token never
       lands in a Helm release record. */}}
{{- if and .Values.bootstrap.wooStore.enabled (not .Values.secrets.existingSecrets) }}
{{- $src := lookup "v1" "Secret" .Values.bootstrap.wooStore.namespace .Values.bootstrap.wooStore.tokenSecret }}
{{- if not $src }}
{{- if not (empty (lookup "v1" "Namespace" "" "")) }}
{{- fail (printf "bootstrap.wooStore: Secret %s/%s not found. Install the store chart first (make store), or set bootstrap.wooStore.enabled=false." .Values.bootstrap.wooStore.namespace .Values.bootstrap.wooStore.tokenSecret) }}
{{- end }}
{{- end }}
---
# The default store's woo-mcp bearer token, copied across namespaces at install time so the gateway can
# seed that upstream. (Stores created later by the provisioner register over the internal API instead.)
apiVersion: v1
kind: Secret
metadata:
  name: bootstrap-upstreams
  labels: {{- include "platform.labels" . | nindent 4 }}
type: Opaque
data:
  woo-token: {{ if $src }}{{ index $src.data "token" }}{{ else }}{{ "placeholder-for-helm-template" | b64enc }}{{ end }}
{{- end }}

# Single-node k3s VPS. Set publicHost to your domain (DNS A record -> VPS IP); cert-manager issues TLS.
publicHost: app.urumi.example.com
publicScheme: https
# Secrets are created before install (deploy/vps/create-secrets.sh), never generated by Helm in production.
secrets:
  existingSecrets: true
gateway:
  replicas: 2
  logLevel: info
dashboard:
  replicas: 2
images:
  gateway: { repository: ghcr.io/OWNER/urumi-gateway, tag: "0.1.0", pullPolicy: IfNotPresent }
  agent: { repository: ghcr.io/OWNER/urumi-agent, tag: "0.1.0", pullPolicy: IfNotPresent }
  dashboard: { repository: ghcr.io/OWNER/urumi-dashboard, tag: "0.1.0", pullPolicy: IfNotPresent }
  fetch: { repository: ghcr.io/OWNER/urumi-mcp-fetch, tag: "0.1.0", pullPolicy: IfNotPresent }
  provisioner: { repository: ghcr.io/OWNER/urumi-provisioner, tag: "0.1.0", pullPolicy: IfNotPresent }
agent:
  llm:
    provider: openai
    existingSecret: agent-llm
ingress:
  tls:
    enabled: true
    secretName: platform-tls
    clusterIssuer: letsencrypt-prod
podDisruptionBudget:
  enabled: true
postgres:
  size: 10Gi
stores:
  domain: shop.urumi.example.com   # wildcard DNS *.shop.urumi.example.com -> VPS IP
  scheme: https
  storeValues:
    images:
      wordpress: { repository: ghcr.io/OWNER/urumi-wordpress, tag: "0.1.0" }
      wooMcp: { repository: ghcr.io/OWNER/urumi-woo-mcp, tag: "0.1.0" }
    ingress:
      tls: { enabled: true, clusterIssuer: letsencrypt-prod }
networkPolicy:
  kubeApi:
    cidrs: ["203.0.113.10/32"]     # the VPS (node) IP
    ports: [6443]

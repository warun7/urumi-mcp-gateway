{{- $name := printf "testkit-%s" .Values.mode }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    app.kubernetes.io/part-of: urumi
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/name: {{ $name }}
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/instance: {{ .Release.Name }} }
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: urumi
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/name: {{ $name }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: server
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          env:
            - { name: MODE, value: {{ .Values.mode | quote }} }
            - { name: PORT, value: "8080" }
            - { name: TOOL_COUNT, value: {{ .Values.toolCount | quote }} }
            {{- if .Values.auth.header }}
            - { name: AUTH_HEADER, value: {{ .Values.auth.header | quote }} }
            - name: AUTH_TOKEN
              valueFrom: { secretKeyRef: { name: {{ .Values.auth.existingSecret }}, key: token } }
            {{- end }}
          ports:
            - { name: http, containerPort: 8080 }
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 20
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          resources: {{- toYaml .Values.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    app.kubernetes.io/part-of: urumi
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  selector: { app.kubernetes.io/instance: {{ .Release.Name }} }
  ports:
    - { name: http, port: 8080, targetPort: http }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $name }}
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/instance: {{ .Release.Name }} }
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: {{ .Values.gateway.namespace }} }
          podSelector:
            matchLabels: {{- toYaml .Values.gateway.podLabels | nindent 14 }}
      ports:
        - { port: 8080, protocol: TCP }
  egress: []

{{- if not .Values.secrets.existingSecrets }}
# Generated on first install, then kept (lookup) and never deleted by `helm uninstall`
# (resource-policy: keep) so a PVC that outlives the release still matches its password.
apiVersion: v1
kind: Secret
metadata:
  name: mariadb
  labels: {{- include "store.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  root-password: {{ include "store.secretValue" (dict "ctx" . "secret" "mariadb" "key" "root-password") }}
  password: {{ include "store.secretValue" (dict "ctx" . "secret" "mariadb" "key" "password") }}
---
apiVersion: v1
kind: Secret
metadata:
  name: wordpress
  labels: {{- include "store.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  admin-password: {{ include "store.secretValue" (dict "ctx" . "secret" "wordpress" "key" "admin-password" "length" 20) }}
  {{- range $k := list "auth-key" "secure-auth-key" "logged-in-key" "nonce-key" "auth-salt" "secure-auth-salt" "logged-in-salt" "nonce-salt" }}
  {{ $k }}: {{ include "store.secretValue" (dict "ctx" $ "secret" "wordpress" "key" $k "length" 64) }}
  {{- end }}
---
# WooCommerce REST API credentials used by woo-mcp. The setup Job inserts them into WooCommerce.
apiVersion: v1
kind: Secret
metadata:
  name: woo-api
  labels: {{- include "store.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  consumer-key: {{ include "store.secretValue" (dict "ctx" . "secret" "woo-api" "key" "consumer-key" "prefix" "ck_" "hex" true) }}
  consumer-secret: {{ include "store.secretValue" (dict "ctx" . "secret" "woo-api" "key" "consumer-secret" "prefix" "cs_" "hex" true) }}
---
# Static bearer token the gateway must present to woo-mcp (defence in depth on top of NetworkPolicy).
apiVersion: v1
kind: Secret
metadata:
  name: woo-mcp-auth
  labels: {{- include "store.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  token: {{ include "store.secretValue" (dict "ctx" . "secret" "woo-mcp-auth" "key" "token" "length" 48) }}
{{- end }}

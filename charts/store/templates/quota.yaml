{{- if .Values.quota.enabled }}
apiVersion: v1
kind: ResourceQuota
metadata:
  name: store-quota
  labels: {{- include "store.labels" . | nindent 4 }}
spec:
  hard: {{- toYaml .Values.quota.hard | nindent 4 }}
---
apiVersion: v1
kind: LimitRange
metadata:
  name: store-limits
  labels: {{- include "store.labels" . | nindent 4 }}
spec:
  limits:
    - type: Container
      default: { cpu: 500m, memory: 512Mi }
      defaultRequest: { cpu: 50m, memory: 64Mi }
      max: { cpu: "2", memory: 1Gi }
{{- end }}

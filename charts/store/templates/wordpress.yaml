apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: wordpress-uploads
  labels: {{- include "store.labels" . | nindent 4 }}
  annotations:
    # Product images. A `helm uninstall` (or a reinstall) must never take them; deleting the store's namespace does.
    helm.sh/resource-policy: keep
spec:
  accessModes: ["ReadWriteOnce"]
  {{- with .Values.persistence.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.uploadsSize }}
---
apiVersion: v1
kind: Service
metadata:
  name: wordpress
  labels: {{- include "store.labels" . | nindent 4 }}
    app.kubernetes.io/name: wordpress
spec:
  selector:
    {{- include "store.selector" . | nindent 4 }}
    app.kubernetes.io/name: wordpress
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wordpress
  labels: {{- include "store.labels" . | nindent 4 }}
    app.kubernetes.io/name: wordpress
spec:
  replicas: 1
  # RWO uploads volume: never run old and new pod side by side on different nodes.
  strategy: { type: Recreate }
  selector:
    matchLabels:
      {{- include "store.selector" . | nindent 6 }}
      app.kubernetes.io/name: wordpress
  template:
    metadata:
      labels:
        {{- include "store.labels" . | nindent 8 }}
        app.kubernetes.io/name: wordpress
    spec:
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 33
        runAsGroup: 33
        fsGroup: 33
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: wordpress
          image: {{ include "store.image" .Values.images.wordpress }}
          imagePullPolicy: {{ .Values.images.wordpress.pullPolicy }}
          securityContext: {{- include "store.containerSecurity" . | nindent 12 }}
          ports:
            - name: http
              containerPort: 8080
          env: {{- include "store.wpEnv" . | nindent 12 }}
          # Probes hit dedicated PHP files: probing "/" would get a canonical 301, which the
          # kubelet counts as success. Liveness never touches the DB (no cascading restarts).
          startupProbe:
            httpGet: { path: /ready.php, port: http }
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: { path: /ready.php, port: http }
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet: { path: /healthz.php, port: http }
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources: {{- toYaml .Values.resources.wordpress | nindent 12 }}
          volumeMounts:
            - { name: uploads, mountPath: /srv/wordpress/wp-content/uploads }
            - { name: tmp, mountPath: /tmp }
            - { name: apache-run, mountPath: /var/run/apache2 }
            - { name: apache-lock, mountPath: /var/lock/apache2 }
      volumes:
        - name: uploads
          persistentVolumeClaim: { claimName: wordpress-uploads }
        - { name: tmp, emptyDir: {} }
        - { name: apache-run, emptyDir: {} }
        - { name: apache-lock, emptyDir: {} }
